[package]
name = "ai"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "AI subsystem for TinyIoTHub — agents, patrol, alarms, memory, tools"

[lib]
name = "tinyiothub_ai"

[dependencies]
# Workspace crates
core = { workspace = true }
runtime = { workspace = true }
llm = { workspace = true }
memory = { workspace = true }
policy = { workspace = true }
skills = { workspace = true }
event = { workspace = true }

# Async runtime
tokio = { workspace = true }
tokio-util = "0.7"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Async trait
async-trait = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# Collections
dashmap = { workspace = true }

# Sync primitives
parking_lot = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }

# ZeroClaw Agent runtime (forked with pub security + pub heartbeat, v0.8.1)
zeroclaw = { git = "https://github.com/Grong/zeroclaw.git", tag = "v0.8.1-patched", package = "zeroclawlabs", features = ["agent-runtime"] }
zeroclaw-api = { git = "https://github.com/Grong/zeroclaw.git", tag = "v0.8.1-patched" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
mockall = { workspace = true }
tempfile = { workspace = true }
