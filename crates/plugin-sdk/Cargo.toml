[package]
name = "plugin-sdk"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "SDK for developing TinyIoTHub device plugins"

[lib]
name = "tinyiothub_plugin_sdk"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
core = { workspace = true, optional = true }

[features]
default = []
core-interop = ["core"]

[dev-dependencies]
tokio = { workspace = true }

# FFI/动态加载例外：unsafe 仅限 driver/plugin 加载路径；
# 其余规则继承 workspace（此处需完整列出，无法部分继承）
[lints.rust]
unsafe_code = "allow"
