[package]
name = "driver"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Driver domain for TinyIoTHub — device data access layer: driver registry API, gateway pairing, device heartbeat, plugin registry, device-legacy connection face (monitoring/performance/query/diagnostics)"

[lib]
name = "tinyiothub_driver"

[dependencies]
# Workspace crates
core = { workspace = true }
db = { workspace = true }
web = { workspace = true }
runtime = { workspace = true }
thing = { workspace = true }
event = { workspace = true }
alarm = { workspace = true }

# Web framework
axum = { workspace = true }

# Async runtime
tokio = { workspace = true }
tokio-cron-scheduler = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }

# Async trait
async-trait = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Database
sqlx = { workspace = true }

# Concurrency
dashmap = { workspace = true }

# HTTP client (plugin protocol/notification/integration handlers)
reqwest = { workspace = true }

# InfluxDB (plugin storage handler)
influxdb2 = { workspace = true }

# Streams (influxdb handler)
futures = { workspace = true }

# Postgres plugin storage handler
tokio-postgres = { workspace = true }

# Pairing code generation
rand = { workspace = true }

# IDs
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
