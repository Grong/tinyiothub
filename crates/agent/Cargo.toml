[package]
name = "agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent domain for TinyIoTHub — agent loop (runtime/orchestration), host (HTTP/services), chat (session proxy) unified in one crate"

[lib]
name = "tinyiothub_agent"

[dependencies]
# Workspace crates
core = { workspace = true }
db = { workspace = true }
web = { workspace = true }
runtime = { workspace = true }
llm = { workspace = true }
memory = { workspace = true }
policy = { workspace = true }
skills = { workspace = true }
event = { workspace = true }
thing = { workspace = true }
auth = { workspace = true }

# Web framework
axum = { workspace = true }

# Async runtime
tokio = { workspace = true }
tokio-util = "0.7"
async-stream = { workspace = true }
futures = { workspace = true }

# HTTP client (chat proxy)
reqwest = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

# Async trait
async-trait = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# Database
sqlx = { workspace = true }

# Collections
dashmap = { workspace = true }

# Sync primitives
parking_lot = { workspace = true }

# Utilities
uuid = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

# ZeroClaw Agent runtime (forked with pub security + pub heartbeat, v0.8.1)
zeroclaw = { git = "https://github.com/Grong/zeroclaw.git", tag = "v0.8.1-patched", package = "zeroclawlabs", features = ["agent-runtime"] }
zeroclaw-api = { git = "https://github.com/Grong/zeroclaw.git", tag = "v0.8.1-patched" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
mockall = { workspace = true }
tempfile = { workspace = true }
