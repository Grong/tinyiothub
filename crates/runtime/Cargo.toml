[package]
name = "runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared runtime infrastructure for TinyIoTHub (drivers, event bus, data server)"

[lib]
name = "tinyiothub_runtime"

# 角色:driver/EventBus 框架（driver 生命周期、事件总线、cron 执行器）
# 禁止依赖:web、apps/* 与领域 crate —— 框架不编排业务流程;规则出处:G 系列计划 Task 7 (G8)
[dependencies]
core = { workspace = true }
macros = { workspace = true }
plugin-sdk = { workspace = true, features = ["core-interop"] }
db = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["process", "sync"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Async trait
async-trait = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Collections
dashmap = { workspace = true }

# Random
rand = { workspace = true }

# Serial (optional)
serialport = { workspace = true, optional = true }

# Caching
moka = { workspace = true }

# Sync primitives
parking_lot = { workspace = true }
arc-swap = "1.9"

# Futures utilities (join_all)
futures-util = { workspace = true }

# Dynamic library loading
libloading = { workspace = true }

# Date/time
chrono = { workspace = true }

# Regex
regex = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

# FFI/动态加载例外：unsafe 仅限 driver/plugin 加载路径；
# 其余规则继承 workspace（此处需完整列出，无法部分继承）
[lints.rust]
unsafe_code = "allow"
