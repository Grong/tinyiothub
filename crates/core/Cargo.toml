[package]
name = "core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core types, traits and utilities for TinyIoTHub"

[lib]
name = "tinyiothub_core"

# 守门：core 只许 trait + 值类型，禁止逻辑函数与 I/O。
# NO axum, NO reqwest —— zero-I/O；sqlx 仅 feature 门控的错误转换。
# tokio 例外：仅 "sync" 原语（mpsc/broadcast 通道类型，无 I/O、无 runtime 绑定），
# 供 driver 契约的 ValueSink/PropertyChangeSource 使用（spec 2026-10-19 §一）。
# 不继承 workspace（其 feature 集含 net/fs 等 I/O）；版本须与 workspace 保持一致。
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
schemars = { version = "1", features = ["derive"] }
tokio = { version = "1.22.0", default-features = false, features = ["sync"] }
sqlx = { workspace = true, optional = true }

[features]
default = []
sqlx = ["dep:sqlx"]

[dev-dependencies]
tokio = { workspace = true }

# FFI/动态加载例外：unsafe 仅限 driver/plugin 加载路径；
# 其余规则继承 workspace（此处需完整列出，无法部分继承）
[lints.rust]
unsafe_code = "allow"
