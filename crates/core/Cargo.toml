[package]
name = "core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core types, traits and utilities for TinyIoTHub"

[lib]
name = "tinyiothub_core"

# 守门：core 只许 trait + 值类型，禁止逻辑函数与 I/O。
# NO tokio, NO axum, NO reqwest —— zero-I/O；sqlx 仅 feature 门控的错误转换。
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
sqlx = { workspace = true, optional = true }

[features]
default = []
sqlx = ["dep:sqlx"]

[dev-dependencies]
tokio = { workspace = true }

# FFI/动态加载例外：unsafe 仅限 driver/plugin 加载路径；
# 其余规则继承 workspace（此处需完整列出，无法部分继承）
[lints.rust]
unsafe_code = "allow"
