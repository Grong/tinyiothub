[package]
name = "admin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Admin domain for TinyIoTHub — system configuration, monitoring dashboard, batch operations, job management API and the open (third-party) API surface"

[lib]
name = "tinyiothub_admin"

[dependencies]
# Workspace crates
core = { workspace = true }
db = { workspace = true }
web = { workspace = true }
runtime = { workspace = true }
scheduler = { workspace = true }
auth = { workspace = true }
tenant = { workspace = true }
thing = { workspace = true }
driver = { workspace = true }
event = { workspace = true }

# Web framework
axum = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

# Async trait
async-trait = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Database (open API raw queries, batch repository)
sqlx = { workspace = true }

# System metrics (health / metrics handlers)
sysinfo = { workspace = true }

# Hashing + constant-time compare (open API key validation)
sha2 = { workspace = true }
subtle = { workspace = true }

# IDs
uuid = { workspace = true }

# Cron expression validation (jobs API)
cron = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
