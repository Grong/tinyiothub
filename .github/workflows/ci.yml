name: CI

on:
  push:
    branches: [main, master, saas]
  pull_request:
    branches: [main, master, saas]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------------
  # Rust Workspace Check
  # -----------------------------------------------------------------------------
  rust-check:
    name: Rust Workspace Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check workspace
        run: cargo check --workspace

      - name: Fmt
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace -- -W clippy::all
        continue-on-error: true

      - name: Test workspace
        run: cargo test --workspace --exclude zeroclaw --lib --bins --tests

      - name: Code coverage
        run: |
          cargo install cargo-tarpaulin --locked
          cargo tarpaulin --workspace --exclude zeroclaw --skip-clean --out xml --output-dir coverage
        continue-on-error: true

      - name: Security audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
        continue-on-error: true

      - name: Dependency check (cargo-deny)
        run: |
          cargo install cargo-deny --locked
          cargo deny check
        continue-on-error: true

      - name: Detect new files
        id: new-files
        run: |
          NEW_FILES=$(git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD --diff-filter=A | grep -E "\.(rs)$" || true)
          {
            echo "new_files<<EOF"
            echo "$NEW_FILES"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          echo "=== New Rust files in this PR ==="
          if [ -z "$NEW_FILES" ]; then
            echo "(none)"
          else
            echo "$NEW_FILES"
          fi

      - name: Architecture Check (New Files Only)
        if: steps.new-files.outputs.new_files != ''
        run: |
          echo "=== Checking ONLY new files for architecture violations ==="
          NEW_FILES="${{ steps.new-files.outputs.new_files }}"
          for file in $NEW_FILES; do
            echo "Checking: $file"

            # 1. 检查是否在 cloud/src/ 下创建了散弹式 utils/helpers
            if echo "$file" | grep -qE "^apps/cloud/src/utils.*\.rs$|^apps/cloud/src/helpers.*\.rs$|^apps/cloud/src/common.*\.rs$"; then
              echo "❌ ARCHITECTURE VIOLATION: Cannot create scatter-shot utils/helpers: $file"
              echo "   ✅ Use shared/ or specific domain modules"
              exit 1
            fi

            # 2. 检查新 domain 文件是否有测试
            if echo "$file" | grep -qE "^(apps/cloud/src/domains|crates)/.*\.rs$"; then
              if ! grep -qE "#\[cfg\(test\)\]|#\[test\]" "$file" 2>/dev/null; then
                echo "⚠️  WARNING: New module file has no tests: $file"
              fi
            fi
          done
          echo "✅ New file architecture check passed"

      - name: Grandfathered Check (All Files)
        run: |
          echo "=== Checking ALL modified files for critical violations ==="

          MODIFIED_HANDLERS=$(git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD | grep -E "^(apps/cloud/src/domains|crates)/.*/handler.*\.rs$" || true)
          if [ -n "$MODIFIED_HANDLERS" ]; then
            for file in $MODIFIED_HANDLERS; do
              if grep -qE "\.unwrap\(\)|\.expect\(\)" "$file" 2>/dev/null; then
                echo "⚠️  WARNING (grandfathered): unwrap in $file - should be fixed"
              fi
            done
          fi

      - name: Domain Dependency Guard (G5)
        run: |
          echo "=== Checking thing/tenant domains carry no agent dependency edge ==="
          # Pattern: whitespace-tolerant absolute path `domains :: agent`, plus
          # `super::...agent` to catch relative paths reaching the agent domain.
          if grep -rEn --include='*.rs' 'domains\s*::\s*agent|super::.*agent' apps/cloud/src/domains/thing apps/cloud/src/domains/tenant; then
            echo "❌ DEPENDENCY VIOLATION: domains/thing and domains/tenant must not reference domains::agent"
            echo "   ✅ Consume agent capabilities via the domain-owned hooks traits (G5a ThingActionHooks / G5b AgentHooks)"
            exit 1
          fi
          echo "✅ Domain dependency guard passed"

      - name: Agent Loop Purity Guard (G9)
        run: |
          echo "=== Checking crates/agent carries no web/storage/domains dependency ==="
          # crates/agent 是纯运行时平面：匹配真实引用形态（use <crate> / <crate>:: 路径，
          # :: 周围空白容忍，与 G5 守卫风格一致），文档注释中的守卫词不触发；
          # crate::domains 防止回流 apps/cloud 领域层。
          if grep -rEn --include='*.rs' 'use\s+(axum|sqlx|tinyiothub_storage)|\b(axum|sqlx|tinyiothub_storage)\s*::\s*|crate\s*::\s*domains' crates/agent/src; then
            echo "❌ DEPENDENCY VIOLATION: crates/agent is the pure runtime plane — no axum/sqlx/storage/domains references"
            echo "   ✅ Web/HTTP concerns belong in apps/cloud host; persistence behind port traits"
            exit 1
          fi
          echo "✅ Agent loop purity guard passed"

      - name: Agent Crate Dependency Tree Guard (G9)
        run: |
          echo "=== Checking crates/agent full dep tree carries no sqlx/storage/db ==="
          # 全树检查（Task 11.5 / D15：runtime→db 边已斩断，agent 全树可达
          # sqlx-free）。--prefix none + {p} 输出纯包名行，锚定 ^ 匹配避免误伤
          # 含 db/sqlx 子串的包。
          # 词表终审修正（CEO review F6）：删除死模式 ^tinyiothub-storage
          # （包名是 db，{p} 永不输出 lib 名）。
          # axum 不进树词表：zeroclaw（git 依赖）经 zeroclaw-gateway/channels
          # 传递引入 axum，树级 axum-free 在 zeroclaw 治理（spec §13 推迟项）
          # 完成前不可达——axum 纯度由上方源码 grep + 下方 Cargo.toml 扫描承担。
          if cargo tree -p agent --prefix none --format "{p}" | grep -E "^sqlx|^db "; then
            echo "❌ DEPENDENCY VIOLATION: crates/agent dependency tree must not contain sqlx/db (incl. renamed deps)"
            echo "   ✅ Persistence belongs behind port traits implemented in apps/cloud"
            exit 1
          fi
          # 改名偷渡守门（CEO review F6 + security review + 对抗性 F2）：
          # `web = { package = "axum" }` 可绕源码 grep（use web:: 不含 axum
          # 字样）且树词表无法查 axum——直接扫描清单的依赖声明形态。覆盖
          # TOML 双引号/单引号字面量与子表形态 `[dependencies.axum]`。
          # 成员清单：直名/改名/子表均违规；根清单：仅改名违规
          # （[workspace.dependencies] 的直名定义是 apps 的合法依赖，
          # 但改名可被成员经 workspace = true 继承）。
          if sed 's/#.*$//' crates/agent/Cargo.toml | grep -nE "^\s*(axum|sqlx|tinyiothub-storage|tinyiothub_storage|db)\s*=|package\s*=\s*[\"'](axum|sqlx|tinyiothub-storage|db)[\"']|^\s*\[[a-zA-Z0-9_.-]*\.(axum|sqlx|tinyiothub-storage|tinyiothub_storage|db)\s*\]"; then
            echo "❌ DEPENDENCY VIOLATION: crates/agent/Cargo.toml must not declare axum/sqlx/storage/db (incl. renamed/sub-table)"
            exit 1
          fi
          if sed 's/#.*$//' Cargo.toml | grep -nE "^\s*[a-zA-Z0-9_-]+\s*=\s*\{[^}]*package\s*=\s*[\"'](axum|sqlx|tinyiothub-storage|db)[\"']"; then
            echo "❌ DEPENDENCY VIOLATION: workspace root must not rename axum/sqlx/storage/db (inheritable by crates/agent)"
            exit 1
          fi
          echo "✅ Agent dependency tree guard passed"

      - name: DB SQL Residence Guard (Task 13)
        run: |
          echo "=== Checking raw SQL lives only in crates/db ==="
          # sqlx::(query|QueryBuilder|raw_sql) 只允许出现在 crates/db。豁免规则：
          # - 文件名含 test_utils / _test，或路径在 tests/ 下；
          # - 内联 #[cfg(test)] 测试模块（sed 截断该标记之后的内容再检查）；
          # - 行内 `guard-exempt` 注释（有据排除项，如 policy_engine.rs 的
          #   policy trait impl —— Task 12 裁决 db 不能依赖 policy crate）。
          # 词表终审扩展（F1）：QueryBuilder/raw_sql 与 sqlx::query 同等守门，
          # 堵住动态 SQL 盲区。
          FAIL=0
          for f in $(grep -rEl --include='*.rs' -E 'sqlx::(query|QueryBuilder|raw_sql)' apps/cloud/src apps/edge/src); do
            case "$f" in
              *test_utils*|*_test*|*tests/*) continue ;;
            esac
            if sed '/#\[cfg(test)\]/,$d' "$f" | grep -nE 'sqlx::(query|QueryBuilder|raw_sql)' | grep -v 'guard-exempt'; then
              echo "❌ raw SQL outside crates/db: $f"
              echo "   ✅ Move the query into a crates/db domain file and expose a Db delegate"
              FAIL=1
            fi
          done
          if [ "$FAIL" -ne 0 ]; then exit 1; fi
          echo "✅ DB SQL residence guard passed"

      - name: Migration DDL-only Guard (Task 13)
        run: |
          echo "=== Checking migrations are DDL-only ==="
          # baseline 豁免（历史快照）；其余迁移不得携带种子数据，种子归 seed.rs。
          # 正则终审修正（CEO review F5 + 对抗性 F3）：旧守卫 grep "INSERT INTO"
          # 大小写敏感且子串匹配——INSERT OR IGNORE INTO（本项目种子惯例）、
          # 小写、多行 INSERT\nINTO、UPDATE/DELETE/REPLACE 全部绕过；行内
          # `--` 注释剥离则会被字符串字面量里的 '--' 反利用（剥离点之后的
          # 同行 DML 被一并抹掉）。现改为：只剥"整行注释"（行首 --），
          # 代码行一律全量扫描 DML 关键词（大小写不敏感、词边界）。
          # 代价：代码行尾注释提及 DML 词会误报——保守方向，响亮失败可人工豁免。
          NON_BASELINE=$(ls crates/db/migrations/*.sql | grep -v baseline || true)
          if [ -n "$NON_BASELINE" ]; then
            OFFENDERS=$(echo "$NON_BASELINE" | xargs -I{} sh -c 'grep -vE "^\s*--" "{}" | grep -qiE "\b(INSERT|REPLACE|UPDATE|DELETE)\b" && echo "{}"' || true)
            if [ -n "$OFFENDERS" ]; then
              echo "$OFFENDERS"
              echo "❌ migrations must be DDL-only (seeds go to seed.rs; INSERT/UPDATE/DELETE/REPLACE incl. INSERT OR IGNORE are forbidden)"
              exit 1
            fi
          fi
          echo "✅ Migration DDL-only guard passed"

  # -----------------------------------------------------------------------------
  # 前端检查
  # -----------------------------------------------------------------------------
  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm --if-present test

      - name: Lint
        run: pnpm --if-present lint

      - name: Build
        run: pnpm build

      - name: Security audit
        run: pnpm audit --audit-level=high || echo "No vulnerabilities found or audit not configured"

      - name: Detect new TypeScript files
        id: new-ts-files
        run: |
          NEW_FILES=$(git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD --diff-filter=A | grep -E "\.(ts|tsx)$" || true)
          {
            echo "new_files<<EOF"
            echo "$NEW_FILES"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          echo "=== New TypeScript files in this PR ==="
          if [ -z "$NEW_FILES" ]; then
            echo "(none)"
          else
            echo "$NEW_FILES"
          fi

      - name: Frontend Architecture Check (New Files Only)
        if: steps.new-ts-files.outputs.new_files != ''
        run: |
          echo "=== Checking ONLY new files for frontend architecture violations ==="
          NEW_FILES="${{ steps.new-ts-files.outputs.new_files }}"
          for file in $NEW_FILES; do
            echo "Checking: $file"
            # git diff returns paths relative to repo root (web/src/...),
            # but this step runs from web/ — strip the prefix.
            rel="${file#web/}"

            # 禁止在 ui/ 组件中直接 fetch
            case "$file" in
              web/src/ui/*)
                if grep -qE "fetch\(|axios\.|useQuery\s*\(" "$rel" 2>/dev/null; then
                  echo "❌ ARCHITECTURE VIOLATION: Direct API call in component: $file"
                  echo "   ✅ Must use web/src/api/ layer"
                  exit 1
                fi
                ;;
            esac

            # 新增的 API 文件必须有导出
            if echo "$file" | grep -qE "^web/src/api/.*\.ts$"; then
              if ! grep -qE "^export " "$rel" 2>/dev/null; then
                echo "❌ VIOLATION: API file has no exports: $file"
                exit 1
              fi
            fi
          done
          echo "✅ New file frontend architecture check passed"

  # -----------------------------------------------------------------------------
  # Commit Message 检查
  # -----------------------------------------------------------------------------
  commit-message-check:
    name: Commit Message Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check commit message
        run: |
          BASE_REF="${{ github.base_ref || 'main' }}"
          git fetch origin "$BASE_REF" --depth=1 2>/dev/null || true
          COMMITS=$(git log "origin/$BASE_REF..HEAD" --oneline --format="%s" 2>/dev/null || echo "")
          if [ -z "$COMMITS" ]; then
            echo "✅ No commits to check"
            exit 0
          fi
          echo "=== Commit Messages ==="
          echo "$COMMITS"
          echo ""
          echo "$COMMITS" | while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            # 跳过 merge commits
            if echo "$msg" | grep -qE "^Merge"; then
              continue
            fi
            # 检查格式：<type>(<scope>): <desc>
            if ! echo "$msg" | grep -qE "^(feat|fix|test|chore|docs|refactor|style|perf|ci|build)\([a-z0-9_-]+\):"; then
              echo "❌ Invalid commit message format: $msg"
              echo "   ✅ Format: <type>(<scope>): <description>"
              echo "   ✅ Example: feat(device): add temperature monitoring"
              exit 1
            fi
          done
          echo "✅ All commit messages are valid"
