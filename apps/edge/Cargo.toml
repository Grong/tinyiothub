[package]
name = "tinyiothub-edge"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "tinyiothub_edge"
path = "src/lib.rs"

[[bin]]
name = "tinyiothub-edge"
path = "src/main.rs"

[dependencies]
core = { workspace = true }
runtime = { workspace = true }
db = { workspace = true }
web = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
rumqttc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
serde_yaml = "0.9"
hostname = "0.4"
mac_address = "1.1"
local-ip-address = "0.6"
sha2 = { workspace = true }
libloading = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# FFI/动态加载例外：unsafe 仅限 driver/plugin 加载路径；
# 其余规则继承 workspace（此处需完整列出，无法部分继承）
[lints.rust]
unsafe_code = "allow"
