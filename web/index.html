        <h1 style="margin:0 0 20px;font-size:40px;line-height:1.25">
          TinyIoTHub — 给设备写 harness，让 AI 真正动手
        </h1>
        <p>
          TinyIoTHub 是一个开源的
          <strong>IoT agent harness（物联网智能体运行环境）</strong>。它把设备、空间、产线、楼宇统一建模为层级化的「物」，
          让一个常驻 Assistant 被设备事件和定时任务唤醒，查询物模型、做出判断、通过审批后执行动作，并回读属性验证结果。
          它解决的不是「连上设备」，而是「让 AI 安全地动手」。
        </p>
        <p>
          <strong>核心事实：</strong>Rust + SQLite 单进程 · 约 80MB 内存 · MIT 协议 · linux/amd64 与 linux/arm64 多架构
          Docker 镜像 · 内嵌 MCP Server · REST API <code>/api/v1/</code>。
        </p>
        <p style="color:#9aa4b2">
          <strong>In English:</strong> TinyIoTHub is an open-source IoT agent harness (MIT) that lets an
          always-on AI assistant safely operate physical devices — event-driven, ontology-aware,
          approval-gated and read-back verified.
        </p>

        <h2>三层结构，价值在中间</h2>
        <ul>
          <li>
            <strong>设备层（底座）：</strong>MQTT 已可用；Modbus、ONVIF、SNMP 驱动框架与 plugin-sdk 已就绪；
            支持 DTDL / WoT 物模板导入导出。
          </li>
          <li>
            <strong>Harness 层（产品本体）：</strong>统一 Session Loop、SKILL.md 按需加载、待办自维护、执行中提问、
            子代理上下文隔离，以及审批、对账与回读验证。
          </li>
          <li>
            <strong>应用层（产物）：</strong>巡检、故障诊断、心跳监控、告警管理等 10 个已交付技能，
            全部是可读可改的 SKILL.md，新增场景不需要改一行 Rust。
          </li>
        </ul>

        <h2>和通用 agent 框架的区别</h2>
        <ol>
          <li><strong>设备动作不可重试：</strong>每个动作记录「意图 → 派发 → 确认 → 未知」四态，未知状态停下来对账，绝不自动重放。</li>
          <li><strong>事件唤醒 + 本体决策：</strong>Assistant 由设备事件和定时 tick 唤醒，依据物模型、层级关系和知识文档判断，而不是靠用户临时喂上下文。</li>
          <li><strong>回读验证 + 全量审计：</strong>动作下发不算完成，必须回读属性确认生效；全过程进入安全/审计账本。</li>
        </ol>

        <h2>常见问题</h2>
        <h3>TinyIoTHub 是什么？</h3>
        <p>
          一个开源的 IoT agent harness。它让常驻 Assistant 在物理世界里执行任务：查本体、做决策、过审批、动手、回读验证。
          服务端 Rust + SQLite，单进程即可私有化部署，MIT 协议。
        </p>
        <h3>和 ThingsBoard 这类 IoT 平台有什么区别？</h3>
        <p>
          传统平台重心是设备接入、数据看板和规则告警；TinyIoTHub 把设备接入当底座，产品本体是设备之上的 harness 层。
          两者可以并存，TinyIoTHub 可以通过 MQTT 接入现有网关。
        </p>
        <h3>支持哪些设备协议？</h3>
        <p>
          MQTT 已可用于设备接入与边缘网关上报；Modbus、ONVIF、SNMP 的驱动框架与 plugin-sdk 已就绪，具体驱动仍在开发中。
        </p>
        <h3>如何部署？</h3>
        <p>
          单个 Rust 二进制加内置 SQLite，不依赖外部数据库；官方提供多架构 Docker 镜像，约 80MB 内存即可运行，支持完全私有化。
        </p>
